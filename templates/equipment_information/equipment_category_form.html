{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <section class="py-sm-7 py-5 position-relative">
    <div class="container">
      <h1>{{ object|yesno:"Update,Create" }} equipment category</h1>
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" class="btn btn-dark bg-gradient" value="{{ object|yesno:"Update,Create" }}">
      </form>
    </div>
  </section>
{% endblock %}
